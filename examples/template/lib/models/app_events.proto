syntax = "proto3";

package hyttahub.example.template;

message AppEvent {

  message ReorderableItem {
    int32 id = 1;
    string title = 2;
  }

  message UpdateText {
    string value = 1;
  }

  message UpdateCode {
    string value = 1;
  }

  message UpdateCheckbox {
    bool value = 1;
  }

  message UpdateDropdown {
    string value = 1;
  }

  message UpdateList {
    repeated ReorderableItem items = 1;
  }

  message UpdatePhoto {
    string name = 1;
    int32 version = 2;
    int32 size = 3;
    // We don't need base64 data here as it's separate in SubmitAppEvent.images or Cloud Storage
  }

  // Keeping TemplateForm for now to avoid breaking existing compiled code immediately, 
  // but we will move to using the individual ones.
  // Actually, we can just add them to the oneof.
  message TemplateForm {
    string textValue = 1;
    string codeValue = 2;
    bool checkboxValue = 3;
    string dropdownValue = 4;
    repeated ReorderableItem listItems = 5;
    string photoName = 7;
    int32 photoVersion = 8;
    int32 photoSize = 9;
  }

  oneof event {
    TemplateForm templateForm = 2;
    UpdateText updateText = 3;
    UpdateCode updateCode = 4;
    UpdateCheckbox updateCheckbox = 5;
    UpdateDropdown updateDropdown = 6;
    UpdateList updateList = 7;
    UpdatePhoto updatePhoto = 8;
  }
}

// The SubmitAppEvent is passed to the submit bloc handler
// PII (ex. email) is allowed in this message since not stored to immutable
// records
message SubmitAppEvent {
  // the final site event will contain this app event
  message SiteEvent {
    int32 version = 1; // the version of the event, required
    int32 author = 2;  // filled in by the app submit bloc
  }

  message Image {
    string base64Data = 1;  // the image data
    string name = 2; // the name of the image, used for display
    int32 size = 3;  // the size of the image in bytes
  }

  AppEvent appEvent = 1;   // the event to store in immutable records, required
  SiteEvent siteEvent = 2; // the version of the event, required
  string authorEmail = 3;  // the author's email, required
  repeated Image images = 4; // for add photo events, the images to upload
}

// The AppEventRecord is a representation of the actual record stored in the
// database This record is used just for display purposes in the client
message AppEventRecord {
  string isoDate = 1;
  int32 version = 2;
  AppEvent appEvent = 3;
}