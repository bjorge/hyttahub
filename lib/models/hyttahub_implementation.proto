
syntax = "proto3";

enum StorageEnum {
  cloud = 0;
  memory = 1;
  local = 2;
}

message HyttaHubImplementation {
  StorageEnum storage = 1;
  int32 appBuildNumber = 2;
  string appId = 3;
  string cloudRootCollection = 4;
  bool disable_cloud_cache = 5;
  string implementation_id = 6;
  bool useIsolates = 7;
}
